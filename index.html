<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover distinctive perfumes, explore fragrance families, and find your next signature scent." />
    <title>DEJA FRAGRANCES — Distinctive Perfumes</title>
    <script>
      (() => {
        const html = document.documentElement;
        html.classList.add("js");
        const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;
        if (location.pathname === "/" && !reducedMotion) {
          window.__dejaSplashStartedAt = performance.now();
          html.classList.add("splash-active");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
